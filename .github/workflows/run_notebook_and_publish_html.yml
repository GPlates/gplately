name: Run notebook and publish HTML

on:
  workflow_dispatch:
    inputs:
      notebook_01_getting_started:
        description: "01-GettingStarted"
        type: boolean
        default: true
      notebook_02_plate_reconstructions:
        description: "02-PlateReconstructions"
        type: boolean
        default: true
      notebook_03_working_with_points:
        description: "03-WorkingWithPoints"
        type: boolean
        default: true
      notebook_04_velocity_basics:
        description: "04-VelocityBasics"
        type: boolean
        default: true
      notebook_05_working_with_feature_geometries:
        description: "05-WorkingWithFeatureGeometries"
        type: boolean
        default: true
      notebook_06_rasters:
        description: "06-Rasters"
        type: boolean
        default: true
      notebook_07_working_with_plate_tectonic_stats:
        description: "07-WorkingWithPlateTectonicStats"
        type: boolean
        default: true
      notebook_08_predicting_slab_flux:
        description: "08-PredictingSlabFlux"
        type: boolean
        default: true
      notebook_09_creating_motion_paths_and_flowlines:
        description: "09-CreatingMotionPathsAndFlowlines"
        type: boolean
        default: true
      notebook_10_seafloor_grids:
        description: "10-SeafloorGrids"
        type: boolean
        default: true
      notebook_11_andes_fluxes:
        description: "11-AndesFluxes"
        type: boolean
        default: true
      notebook_12_mutschler_world_porphyry_copper_deposits_regional_plots:
        description: "12-MutschlerWorldPorphyryCopperDepositsRegionalPlots"
        type: boolean
        default: true
      notebook_13_reconstructing_zircon_data:
        description: "13-ReconstructingZirconData"
        type: boolean
        default: true
      notebook_14:
        description: "14-RuleBasedGPMLProcessingPipeline"
        type: boolean
        default: true
      notebook_15:
        description: "15-ConvertGridReferenceFrame"
        type: boolean
        default: true
      notebook_examples_hello_world:
        description: "Examples/hello_world"
        type: boolean
        default: true
      notebook_examples_icosahedron_mesh:
        description: "Examples/icosahedron_mesh"
        type: boolean
        default: true
      notebook_examples_introducing_plate_model_manager:
        description: "Examples/introducing_plate_model_manager"
        type: boolean
        default: true
      notebook_examples_plot_map_with_cartopy:
        description: "Examples/plot_map_with_cartopy"
        type: boolean
        default: true
      notebook_plot_map_with_pygmt:
        description: "Examples/plot_map_with_pygmt"
        type: boolean
        default: true
      notebook_examples_reconstruct_files:
        description: "Examples/reconstruct_files"
        type: boolean
        default: true
      notebook_examples_save_reconstructed_data:
        description: "Examples/save_reconstructed_data"
        type: boolean
        default: true
      notebook_examples_use_auxiliary_functions:
        description: "Examples/use_auxiliary_functions"
        type: boolean
        default: true
      notebook_examples_use_your_own_plate_model:
        description: "Examples/use_your_own_plate_model"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  execute-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: "1.5.8-0"
          environment-file: conda/doc-env.yml
          init-shell: bash
          cache-environment: true
          post-cleanup: all

      - name: Install current gplately
        run: |
          pip install . --no-binary :all: --no-cache-dir --no-dependencies

      - name: Execute notebooks
        run: |
          notebooks=()
          ${{ inputs.notebook_01_getting_started }} && notebooks+=(01-GettingStarted)
          ${{ inputs.notebook_02_plate_reconstructions }} && notebooks+=(02-PlateReconstructions)
          ${{ inputs.notebook_03_working_with_points }} && notebooks+=(03-WorkingWithPoints)
          ${{ inputs.notebook_04_velocity_basics }} && notebooks+=(04-VelocityBasics)
          ${{ inputs.notebook_05_working_with_feature_geometries }} && notebooks+=(05-WorkingWithFeatureGeometries)
          ${{ inputs.notebook_06_rasters }} && notebooks+=(06-Rasters)
          ${{ inputs.notebook_07_working_with_plate_tectonic_stats }} && notebooks+=(07-WorkingWithPlateTectonicStats)
          ${{ inputs.notebook_08_predicting_slab_flux }} && notebooks+=(08-PredictingSlabFlux)
          ${{ inputs.notebook_09_creating_motion_paths_and_flowlines }} && notebooks+=(09-CreatingMotionPathsAndFlowlines)
          ${{ inputs.notebook_10_seafloor_grids }} && notebooks+=(10-SeafloorGrids)
          ${{ inputs.notebook_11_andes_fluxes }} && notebooks+=(11-AndesFluxes)
          ${{ inputs.notebook_12_mutschler_world_porphyry_copper_deposits_regional_plots }} && notebooks+=(12-MutschlerWorldPorphyryCopperDepositsRegionalPlots)
          ${{ inputs.notebook_13_reconstructing_zircon_data }} && notebooks+=(13-ReconstructingZirconData)
          ${{ inputs.notebook_14 }} && notebooks+=(14-RuleBasedGPMLProcessingPipeline)
          ${{ inputs.notebook_15 }} && notebooks+=(15-ConvertGridReferenceFrame)
          ${{ inputs.notebook_examples_hello_world }} && notebooks+=(Examples/hello_world)
          ${{ inputs.notebook_examples_icosahedron_mesh }} && notebooks+=(Examples/icosahedron_mesh)
          ${{ inputs.notebook_examples_introducing_plate_model_manager }} && notebooks+=(Examples/introducing_plate_model_manager)
          ${{ inputs.notebook_examples_plot_map_with_cartopy }} && notebooks+=(Examples/plot_map_with_cartopy)
          ${{ inputs.notebook_plot_map_with_pygmt }} && notebooks+=(Examples/plot_map_with_pygmt)
          ${{ inputs.notebook_examples_reconstruct_files }} && notebooks+=(Examples/reconstruct_files)
          ${{ inputs.notebook_examples_save_reconstructed_data }} && notebooks+=(Examples/save_reconstructed_data)
          ${{ inputs.notebook_examples_use_auxiliary_functions }} && notebooks+=(Examples/use_auxiliary_functions)
          ${{ inputs.notebook_examples_use_your_own_plate_model }} && notebooks+=(Examples/use_your_own_plate_model)

          if [ ${#notebooks[@]} -eq 0 ]; then
            echo "No notebooks selected. Skipping execution."
            exit 0
          fi

          for notebook in "${notebooks[@]}"; do
            mkdir -p "/tmp/notebook-run/${notebook}"
            notebook_file="$(basename "${notebook}").ipynb"
            jupyter nbconvert \
              --to notebook \
              --execute \
              --output "${notebook_file}" \
              --output-dir "/tmp/notebook-run/${notebook}" \
              "Notebooks/${notebook}.ipynb"

            mkdir -p "notebook-html/$(dirname "${notebook}")"
            jupyter nbconvert \
              --to html \
              --output "${notebook}.html" \
              --output-dir notebook-html \
              "/tmp/notebook-run/${notebook}/${notebook_file}"
          done

      - name: Deploy HTML to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.2.2
        with:
          branch: gh-pages
          folder: notebook-html
          target-folder: sphinx-latest/notebook-html
          clean: false
