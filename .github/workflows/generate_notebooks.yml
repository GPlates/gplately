name: Generate Notebooks

on:
  push:
    paths:
      - Notebooks/14-RuleBasedGPMLProcessingPipeline.py
      - Notebooks/Examples/hello_world.py
      - Notebooks/Examples/icosahedron_mesh.py
      - Notebooks/Examples/introducing_plate_model_manager.py
      - Notebooks/Examples/plot_map_with_cartopy.py
      - Notebooks/Examples/plot_map_with_pygmt.py
      - Notebooks/Examples/reconstruct_files.py
      - Notebooks/Examples/save_reconstructed_data.py
      - Notebooks/Examples/use_auxiliary_functions.py
      - Notebooks/Examples/use_your_own_plate_model.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-notebook:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jupytext
        run: python -m pip install --upgrade pip jupytext

      - name: Generate notebooks
        run: |
          notebooks=(
            Notebooks/14-RuleBasedGPMLProcessingPipeline.ipynb
            Notebooks/Examples/hello_world.ipynb
            Notebooks/Examples/icosahedron_mesh.ipynb
            Notebooks/Examples/introducing_plate_model_manager.ipynb
            Notebooks/Examples/plot_map_with_cartopy.ipynb
            Notebooks/Examples/plot_map_with_pygmt.ipynb
            Notebooks/Examples/reconstruct_files.ipynb
            Notebooks/Examples/save_reconstructed_data.ipynb
            Notebooks/Examples/use_auxiliary_functions.ipynb
            Notebooks/Examples/use_your_own_plate_model.ipynb
          )

          for notebook in "${notebooks[@]}"; do
            script_file="${notebook%.ipynb}.py"
            if [ -f "${script_file}" ]; then
              jupytext --to notebook "${script_file}" -o "${notebook}"
            else
              echo "Skipping ${notebook}: missing source script ${script_file}"
            fi
          done

      - name: Commit updated notebooks
        run: |
          notebooks=(
            Notebooks/14-RuleBasedGPMLProcessingPipeline.ipynb
            Notebooks/Examples/hello_world.ipynb
            Notebooks/Examples/icosahedron_mesh.ipynb
            Notebooks/Examples/introducing_plate_model_manager.ipynb
            Notebooks/Examples/plot_map_with_cartopy.ipynb
            Notebooks/Examples/plot_map_with_pygmt.ipynb
            Notebooks/Examples/reconstruct_files.ipynb
            Notebooks/Examples/save_reconstructed_data.ipynb
            Notebooks/Examples/use_auxiliary_functions.ipynb
            Notebooks/Examples/use_your_own_plate_model.ipynb
          )

          changed=()
          for notebook in "${notebooks[@]}"; do
            [ -f "${notebook}" ] || continue
            git diff --quiet -- "${notebook}" || changed+=("${notebook}")
          done

          if [ ${#changed[@]} -eq 0 ]; then
            echo "No notebook changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${changed[@]}"
          git commit -m "ci: regenerate notebooks"
          git push
