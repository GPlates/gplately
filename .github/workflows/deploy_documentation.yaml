# This workflow builds and deploys the documentation for GPlately to GitHub Pages.

name: Build and Deploy Documentation to GitHub Pages

on: 
  push:
    branches: 
      - master
  workflow_dispatch:
  
jobs:
  build-and-deploy-documentation:
    name: Build and Deploy Documentation to GitHub Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
        
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags needed so setuptools-git-versioning can
          # compute the real version instead of falling back to 0.0.1.
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: "1.5.8-0"
          environment-file: conda/doc-env.yml
          init-shell: >-
            bash
          cache-environment: true
          post-cleanup: "all"

      - name: Install current GPlately
        run: |
          pip install . --no-binary :all: --no-cache-dir --no-dependencies

      - name: Build doc with Sphinx
        run : |
          sphinx-autogen -o generated sphinx-doc/source/*.rst
          cd sphinx-doc
          make html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.2.2
        with:
          branch: gh-pages
          folder: sphinx-doc/build/
          target-folder: latest/sphinx/

      
