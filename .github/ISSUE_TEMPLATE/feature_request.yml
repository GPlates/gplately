name: Feature request
description: Suggest a new feature or an improvement to GPlately.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        If you'd like to implement this yourself, please wait until a maintainer has agreed on the approach here before opening a pull request (see CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or workflow this would help with.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How you think it could work (optional). Include any alternatives you've considered.
  - type: dropdown
    id: implement
    attributes:
      label: Would you like to implement this?
      options:
        - "No"
        - "Yes, once the approach is agreed"
