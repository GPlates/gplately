{% set name = "gplately" %}
{% set version = "2.0.0" %}
# Python 3.12 or later, not conda-forge's default python_min: rasterio requires 3.12 from 1.5,
# and its last build for 3.11 (1.4.4, December 2025) needs GDAL older than 3.13, which
# pyGPlates 1.1 is built against. So with pyGPlates 1.1, an environment on 3.11 can't be solved.
# (pip has no such limit: the pyGPlates wheels bundle their own GDAL.)
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.16.0
    - scipy >=1.0.0
    - pygplates >= 1.0.0
    - shapely
    - matplotlib-base
    - cartopy
    - pooch
    - tqdm
    - netcdf4
    - rasterio
    - geopandas
    - plate-model-manager >= 1.3.0
    - pyyaml

test:
  imports:
    - gplately
  commands:
    - pip check
  requires:
    - pip
    - pytest
    - python {{ python_min }}

about:
  home: https://github.com/GPlates/gplately
  license: GPL-2.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: Object-orientated Python interface to pyGPlates for plate tectonic reconstructions

extra:
  recipe-maintainers:
    - brmather
    - jcannon-gplates
    - michaelchin
